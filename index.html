<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PAWVERSE – White Pomeranian Edition | 3D Pet Care & VR</title>

  <!-- A-Frame 1.6.0 for WebXR and VR compatibility -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <style>
    /* -------------------------------------------------------------
       PAWVERSE LUXURY STYLING & HIGH-GRAPHICS GLASSMORPHISM UI
       Palette: Pure Cloud White, Champagne Rose, Sky Indigo, Soft Emerald
       ------------------------------------------------------------- */
    :root {
      --bg-cream: #FCFAF7;
      --primary: #FF7E5F;
      --primary-hover: #FEB47B;
      --accent-pom: #FFFFFF;
      --pom-pink: #FFCCD5;
      --accent-blue: #4EA8DE;
      --accent-green: #52B788;
      --text-dark: #2B2D42;
      --text-muted: #6C757D;
      --card-bg: rgba(255, 255, 255, 0.94);
      --card-border: rgba(255, 126, 95, 0.28);
      --glass-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
      --glow-pink: 0 0 20px rgba(255, 126, 95, 0.4);
      --font-main: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-main);
      background-color: #0F172A;
      color: var(--text-dark);
    }

    #scene-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    #ui-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      transition: all 0.3s ease;
    }

    .interactive { pointer-events: auto !important; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      padding: 10px 20px;
      border-radius: 50px;
      box-shadow: var(--glass-shadow);
      border: 1.5px solid var(--card-border);
    }

    .brand-title {
      font-weight: 800;
      font-size: 19px;
      background: linear-gradient(135deg, #FF6B6B, #FFA07A, #FFD166);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .pet-hud-card {
      position: absolute;
      top: 80px; left: 16px;
      width: 320px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-radius: 26px;
      padding: 18px;
      box-shadow: var(--glass-shadow);
      border: 2px solid rgba(255, 255, 255, 0.85);
    }

    .bottom-dock {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 10px 14px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      min-width: 72px;
      color: var(--text-dark);
    }

    .action-btn:hover {
      transform: translateY(-8px) scale(1.04);
      box-shadow: 0 16px 36px rgba(255, 126, 95, 0.35);
      border-color: var(--primary);
    }
  </style>
</head>

<body>
  <!-- 3D SCENE & PROCEDURAL RIG -->
  <div id="scene-container">
    <a-scene 
      id="main-scene" 
      background="color: #CBE3FB" 
      renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true; highRefreshRate: true; toneMapping: ACESFilmic"
      webxr="optionalFeatures: hit-test, local-floor">

      <!-- High-End Lighting -->
      <a-entity light="type: directional; color: #FFFBF0; intensity: 1.45; castShadow: true" position="15 28 12"></a-entity>
      <a-entity light="type: ambient; color: #E8F4FD; intensity: 0.95"></a-entity>
      <a-entity light="type: directional; color: #FFE3E8; intensity: 0.4" position="-12 18 -10"></a-entity>
      <a-entity id="fireplace-light" light="type: point; color: #FFA94D; intensity: 1.8; distance: 14" position="-4 1.2 -4"></a-entity>

      <a-sky id="paw-sky" color="#CBE3FB"></a-sky>

      <!-- Camera Rig with Quest 3S Controllers and Desktop Controls -->
      <a-entity id="rig" position="0 0 2">
        <a-camera id="player-camera" position="0 1.6 0" look-controls="pointerLockEnabled: false" wasd-controls="acceleration: 20">
          <a-entity id="desktop-cursor" cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .clickable; far: 30"></a-entity>
        </a-camera>
        <a-entity id="left-hand" laser-controls="hand: left" quest-locomotion raycaster="objects: .clickable; far: 15; lineColor: #FF7E5F"></a-entity>
        <a-entity id="right-hand" laser-controls="hand: right" quest-locomotion raycaster="objects: .clickable; far: 15; lineColor: #4EA8DE"></a-entity>
      </a-entity>

      <!-- Environment: Oak Parquet Living Room, Garden, Stations -->
      <a-plane position="0 -0.01 0" rotation="-90 0 0" width="80" height="80" color="#7BC8A4"></a-plane>
      <a-plane position="-3 0.01 -3" rotation="-90 0 0" width="14" height="14" color="#DDA15E"></a-plane>
      <a-circle position="-3 0.025 -3" rotation="-90 0 0" radius="3.6" color="#FFF8F0"></a-circle>

      <!-- The Procedural White Pomeranian Companion -->
      <a-entity id="pet-companion" position="0 0 -1" class="clickable" onclick="window.PawverseApp.doCareAction('cuddle')"></a-entity>

      <!-- Interactive Fetch Tennis Ball -->
      <a-sphere id="interactive-ball" class="clickable" onclick="window.PawverseApp.throwBall()" position="0 0.25 1" radius="0.22" color="#CCFF00" shadow></a-sphere>

      <!-- Particle Container -->
      <a-entity id="particles-container"></a-entity>
    </a-scene>
  </div>

  <script>
    // 1. Procedural Web Audio Synthesizer (Pomeranian Yips, Chords, Purrs)
    class PawverseAudioEngine {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }
      playPomBark() {
        if (this.isMuted) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(620, now);
        osc.frequency.exponentialRampToValueAtTime(260, now + 0.14);
        gain.gain.setValueAtTime(0.32, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.14);
      }
    }

    // 2. Procedural White Pomeranian 3D Rig Component
    AFRAME.registerComponent('procedural-pet', {
      schema: { breedId: { type: 'string', default: 'white_pomeranian' } },
      init: function () {
        this.time = 0;
        this.animState = 'idle';
        this.buildProceduralMesh();
      },
      buildProceduralMesh: function () {
        const petRoot = new THREE.Group();
        const whiteMat = new THREE.MeshLambertMaterial({ color: 0xFFFFFF });
        
        // Pomeranian Torso & Cloud Fluff Cluster
        const body = new THREE.Mesh(new THREE.SphereGeometry(0.52, 16, 16), whiteMat);
        body.position.set(0, 0.48, 0);
        petRoot.add(body);

        // Fluffy Lion-like Ruff / Mane
        const offsets = [[0, 0.12, 0.38, 0.32], [-0.22, 0.05, 0.32, 0.28], [0.22, 0.05, 0.32, 0.28]];
        offsets.forEach(([x, y, z, r]) => {
          const puff = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 10), whiteMat);
          puff.position.set(x, y, z);
          body.add(puff);
        });

        // Curled Plume Tail over back
        const plume = new THREE.Mesh(new THREE.SphereGeometry(0.24, 10, 10), whiteMat);
        plume.position.set(0, 0.28, 0.15);
        body.add(plume);

        this.el.object3D.add(petRoot);
      }
    });
  </script>
</body>
</html>
